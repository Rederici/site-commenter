<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Commenter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="logo">SC</span>
      <div>
        <strong>Site Commenter</strong>
        <small>
          замечания →
          <a id="youtrack-link" href="https://yt.example.com" target="_blank" rel="noreferrer">YouTrack</a>
        </small>
      </div>
    </header>

    <main>
      <section id="auth" class="auth"></section>

      <section id="settings" class="settings" hidden>
        <label class="field">
          <span>Проект <b class="required" aria-hidden="true">*</b></span>
          <select id="project"></select>
        </label>
        <label class="field">
          <span>Тип задачи <b class="required" aria-hidden="true">*</b></span>
          <select id="type"></select>
        </label>

        <div class="sites">
          <div class="sites-head">Где работает попап</div>
          <ul id="sites" class="sites-list"></ul>
          <div class="site-add">
            <input id="site-input" type="text" placeholder="todo.example.com" />
            <button id="site-add" class="btn btn-secondary" type="button">Добавить</button>
          </div>
          <p class="hint">Домен или URL. После изменения обновите открытые вкладки.</p>
        </div>

        <p class="hint">Проект обязателен: без него задача не создастся. Тип по умолчанию — Bug, если он доступен.</p>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
