<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Commenter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="logo">SC</span>
      <div>
        <strong>Site Commenter</strong>
        <small>замечания → YouTrack</small>
      </div>
    </header>

    <main>
      <section id="auth" class="auth"></section>

      <section id="settings" class="settings" hidden>
        <label class="field">
          <span>Проект</span>
          <select id="project"></select>
        </label>
        <label class="field">
          <span>Тип задачи</span>
          <select id="type"></select>
        </label>
        <p class="hint">Проект обязателен: без него задача не создастся. Тип по умолчанию — Bug, если он доступен.</p>
      </section>

      <p id="status" class="status" role="status"></p>

      <div class="actions">
        <button id="open" class="btn btn-secondary" type="button">Открыть форму замечания</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
